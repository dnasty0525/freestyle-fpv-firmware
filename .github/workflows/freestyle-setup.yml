# Freestyle Setup (web configurator): test against SITL, then publish to GitHub Pages.
# One-time: repo Settings -> Pages -> Source: GitHub Actions.
name: Freestyle Setup

on:
  push:
    branches: [freestyle/main]
    paths:
      - 'configurator/**'
      - 'src/main/**'
      - '.github/workflows/freestyle-setup.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: freestyle-setup-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build SITL
        run: make SITL -j"$(nproc)"
      - name: Wizard protocol and presets against SITL
        run: node configurator/test/sitl.test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: configurator
      - id: deployment
        uses: actions/deploy-pages@v4
